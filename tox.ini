[tox]
minversion = 1.8
envlist = trac_1.6, cover

[testenv]
basepython = python3

deps =
    # Trac 1.6 imports pkg_resources, which was removed in setuptools 81.
    setuptools<81
    trac_1.6: Trac>=1.6,<1.7

    cover: pytest-cov

    -e.[testing]

commands =
    pytest -q

[testenv:cover]
commands =
    # See .coveragerc for coverage configuration
    pytest -q --cov trac_oidc --cov-report=html -k 'not functional'
    coverage report --show-missing --fail-under=100 --omit='*/tests/*'

[pytest]
norecursedirs = .tox build
