[tox]
minversion = 1.8
envlist = trac_1.4, trac_1.6, cover

[testenv]
basepython = python3

deps =
    trac_1.4: Trac>=1.4,<1.5
    trac_1.6: Trac>=1.6,<1.7

    cover: pytest-cov

    -e.[testing]

commands =
    pytest -q

[testenv:cover]
commands =
    # See .coveragerc for coverage configuration
    pytest -q --cov trac_oidc --cov-report=html -k 'not functional'
    coverage report --show-missing --fail-under=100 --omit='*/test_functional.py'

[pytest]
norecursedirs = .tox build
